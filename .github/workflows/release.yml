name: Release

# Triggered by a version tag pushed to the repo, e.g.:
#   git tag v1.2.3 && git push origin v1.2.3
# Builds the Linux (.deb/.rpm/.AppImage) and Windows (.zip portable +
# .exe installer) packages, then attaches them to a GitHub Release
# automatically created for that tag.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # needed to create the Release and upload files to it

jobs:
  tests:
    name: Tests (safety net before release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - run: pytest tests/ -v

  build-linux:
    name: Build Linux (.deb/.rpm/.AppImage)
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Derive the version number from the tag (vX.Y.Z → X.Y.Z)
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Install system dependencies (rpmbuild, dpkg-deb, fuse for AppImage)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm dpkg-dev libfuse2 || true

      - name: Build the executable
        run: ./build.sh

      - name: Package .deb
        run: VERSION="$VERSION" ./package_deb.sh

      - name: Package .rpm
        run: VERSION="$VERSION" ./package_rpm.sh

      - name: Package .AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"   # appimagetool without native FUSE (runner-independent)
        run: VERSION="$VERSION" ./package_appimage.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/linux/*.deb
            dist/linux/*.rpm
            dist/linux/*.AppImage
          if-no-files-found: error

  build-windows:
    name: Build Windows (.zip + installer)
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Derive the version number from the tag (vX.Y.Z → X.Y.Z)
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build the executable
        shell: cmd
        run: build.bat < nul

      - name: Package portable .zip
        shell: cmd
        run: package_zip_win.bat < nul

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Package .exe installer
        shell: cmd
        run: package_installer_win.bat < nul

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          # Only the portable zip and the installer are user-facing
          # deliverables — dist/windows/VentoyIsoUpdater.exe is the raw
          # intermediate binary (already included in both), not a
          # standalone release artifact.
          path: |
            dist/windows/*.zip
            dist/windows/*-windows-setup.exe
          if-no-files-found: error

  release:
    name: Publish the GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create the Release and attach the packages
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/linux-packages/*
            artifacts/windows-packages/*
